$schema: https://azuremlschemas.azureedge.net/latest/managedOnlineDeployment.schema.json
name: blue
endpoint_name: woundwatch-endpoint-v2

code_configuration:
  code: ..
  scoring_script: azure/score.py

environment: azureml:wound-monitoring-inference:4

model: azureml:wound-monitoring-model-bundle:1

instance_type: Standard_E4s_v3
instance_count: 1
app_insights_enabled: true

readiness_probe:
  initial_delay: 120
  period: 30
  timeout: 10
  failure_threshold: 30

liveness_probe:
  initial_delay: 120
  period: 30
  timeout: 10
  failure_threshold: 30

request_settings:
  request_timeout_ms: 90000
  max_concurrent_requests_per_instance: 1
  max_queue_wait_ms: 5000